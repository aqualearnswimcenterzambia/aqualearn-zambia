{% extends 'base.html' %}

{% block content %}
<style>
    .auth-bg {
        min-height: 100vh;
        background: linear-gradient(135deg, rgba(4, 42, 54, 0.8), rgba(8, 76, 97, 0.85)), 
                    url("{{ url_for('static', filename='images/hero-bg.jpg.jpeg') }}") center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .glass-card {
        background: rgba(4, 42, 54, 0.55);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        width: 100%;
        max-width: 440px;
        color: white;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .glass-input {
        background: rgba(255, 255, 255, 0.15) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        color: white !important;
        border-radius: 10px;
        padding: 12px 16px;
    }
    .glass-input::placeholder { color: rgba(255, 255, 255, 0.6); }
</style>

<div class="auth-bg">
    <div class="glass-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <h3 class="brand-font fw-bold mb-1">Aqualearn</h3>
            <p class="small text-info text-uppercase tracking-widest mb-3">Swim Center</p>
            <h5 class="fw-bold mb-1">Sign In to Portal</h5>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label small fw-bold">Username</label>
                <input type="text" name="username" class="form-control glass-input" placeholder="Enter username" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" name="password" class="form-control glass-input" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-info text-white w-100 py-3 fw-bold rounded-pill shadow">SIGN IN</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary">
            <p class="small mb-0 opacity-75">
                Need an account? <a href="{{ url_for('register') }}" class="text-info fw-bold text-decoration-none">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
