{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 rounded-4 shadow-lg p-4 bg-white">
                <div class="text-center mb-4">
                    <h2 class="brand-font fw-bold" style="color: var(--dark-teal);">Join Aqualearn</h2>
                    <p class="text-muted small">Create your account to get started</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full Name / Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="e.g. 0973962425" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter secure password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Account Role</label>
                        <select name="role" id="roleSelect" class="form-select" required onchange="togglePackageField()">
                            <option value="client">Client / Student Swimmer</option>
                            <option value="coach">Coach</option>
                            <option value="manager">Manager / Head Coach</option>
                        </select>
                    </div>

                    <div class="mb-4" id="packageField">
                        <label class="form-label small fw-bold">Select Swimming Package (Clients Only)</label>
                        <select name="package" class="form-select">
                            <option value="4">4 Sessions Package</option>
                            <option value="10" selected>10 Sessions Package</option>
                            <option value="15">15 Sessions Package</option>
                            <option value="20">20 Sessions Package</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-info text-white w-100 py-3 fw-bold rounded-pill shadow-sm">REGISTER ACCOUNT</button>
                </form>

                <div class="text-center mt-3">
                    <p class="small text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-info fw-bold text-decoration-none">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePackageField() {
    let role = document.getElementById('roleSelect').value;
    let pkgField = document.getElementById('packageField');
    if (role === 'client') {
        pkgField.style.display = 'block';
    } else {
        pkgField.style.display = 'none';
    }
}
</script>
{% endblock %}
