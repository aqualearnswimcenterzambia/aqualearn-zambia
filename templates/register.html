<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Aqua Learn Swim Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .register-card { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); width: 100%; max-width: 600px; border: none; }
        .brand-header { color: #0b2545; font-weight: bold; text-align: center; margin-bottom: 25px; }
        .brand-header span { display: block; font-size: 0.9rem; color: #6c757d; font-weight: normal; }
        .btn-custom-cyan { background-color: #00d2d3; color: #000000; font-weight: 600; border: none; border-radius: 20px; padding: 10px; width: 100%; }
        .btn-custom-cyan:hover { background-color: #00b5b6; color: #000000; }
        .child-box { background: #f1f3f5; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="brand-header">AQUALEARN <span>Create Account & Register Swimmers</span></div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="{{ url_for('register') }}" method="POST" id="registrationForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Client / Parent / Guardian Full Name</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter full name">
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" required placeholder="e.g. 0972810511">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Create a secure password">
            </div>
            <div class="mb-3">
                <label for="role" class="form-label fw-semibold">Account Type</label>
                <select class="form-select" id="role" name="role" onchange="toggleAccountType(this.value)" required>
                    <option value="client" selected>Client / Swimmer Account</option>
                    <option value="coach">Coach</option>
                </select>
            </div>
            <div id="children_section">
                <hr>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0 text-secondary">Swimmers / Client Details</h5>
                    <button type="button" class="btn btn-sm btn-outline-primary rounded-pill" onclick="addChildField()">+ Add Swimmer</button>
                </div>
                <div id="children_container">
                    <div class="child-box">
                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Swimmer / Client Name</label>
                            <input type="text" class="form-control form-control-sm swimmer-name-input" name="child_names[]" required placeholder="Enter swimmer full name">
                        </div>
                        <div>
                            <label class="form-label small fw-semibold">Select Sessions</label>
                            <select class="form-select form-select-sm" name="child_sessions[]">
                                <option value="4">4 Sessions</option>
                                <option value="8">8 Sessions</option>
                                <option value="10" selected>10 Sessions</option>
                                <option value="12">12 Sessions</option>
                                <option value="15">15 Sessions</option>
                                <option value="20">20 Sessions</option>
                                <option value="25">25 Sessions</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-custom-cyan shadow-sm mb-3 mt-3">Register & Enroll</button>
            <div class="text-center">
                <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold" style="color: #0b2545;">Sign In</a></p>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleAccountType(role) {
            const childrenSection = document.getElementById('children_section');
            const swimmerInputs = document.querySelectorAll('.swimmer-name-input');
            
            if (role === 'coach') {
                childrenSection.style.display = 'none';
                swimmerInputs.forEach(input => input.removeAttribute('required'));
            } else {
                childrenSection.style.display = 'block';
                swimmerInputs.forEach(input => input.setAttribute('required', 'required'));
            }
        }

        function addChildField() {
            const container = document.getElementById('children_container');
            const role = document.getElementById('role').value;
            const isRequired = role === 'client' ? 'required' : '';
            const box = document.createElement('div');
            box.className = 'child-box';
            box.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label small fw-semibold mb-0">Swimmer / Client Name</label>
                    <button type="button" class="btn btn-sm text-danger p-0" onclick="this.parentElement.parentElement.remove()">Remove</button>
                </div>
                <div class="mb-2">
                    <input type="text" class="form-control form-control-sm swimmer-name-input" name="child_names[]" ${isRequired} placeholder="Enter swimmer full name">
                </div>
                <div>
                    <label class="form-label small fw-semibold">Select Sessions</label>
                    <select class="form-select form-select-sm" name="child_sessions[]">
                        <option value="4">4 Sessions</option>
                        <option value="8">8 Sessions</option>
                        <option value="10" selected>10 Sessions</option>
                        <option value="12">12 Sessions</option>
                        <option value="15">15 Sessions</option>
                        <option value="20">20 Sessions</option>
                        <option value="25">25 Sessions</option>
                    </select>
                </div>
            `;
            container.appendChild(box);
        }
    </script>
</body>
</html>
