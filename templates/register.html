<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Aqua Learn Swim Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .register-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            border: none;
        }
        .brand-header {
            color: #0b2545;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-header span {
            display: block;
            font-size: 0.9rem;
            color: #6c757d;
            font-weight: normal;
        }
        .btn-custom-cyan {
            background-color: #00d2d3;
            color: #000000;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            padding: 10px;
            width: 100%;
        }
        .btn-custom-cyan:hover {
            background-color: #00b5b6;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand-header">
            AQUALEARN
            <span>Create Your Account</span>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your full name">
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" required placeholder="e.g. 0972810511">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="Create a secure password">
            </div>

            <!-- Role Selection -->
            <div class="mb-3">
                <label for="role" class="form-label fw-semibold">Account Type</label>
                <select class="form-select" id="role" name="role" onchange="toggleSessionSelect(this.value)" required>
                    <option value="client" selected>Client / Swimmer</option>
                    <option value="coach">Coach</option>
                </select>
            </div>

            <!-- Package & Session Selector (Shows for Clients) -->
            <div class="mb-3" id="session_group">
                <label for="package_select" class="form-label fw-semibold">Select Training Package & Sessions</label>
                <select class="form-select" id="package_select" name="total_sessions">
                    <option value="5">Starter Package - 5 Sessions</option>
                    <option value="10" selected>Standard Package - 10 Sessions</option>
                    <option value="15">Advanced Package - 15 Sessions</option>
                    <option value="20">Pro Intensive Package - 20 Sessions</option>
                </select>
            </div>

            <input type="hidden" name="package_name" value="Swimming Program">

            <button type="submit" class="btn btn-custom-cyan shadow-sm mb-3">Register & Continue</button>

            <div class="text-center">
                <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold" style="color: #0b2545;">Sign In</a></p>
            </div>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSessionSelect(role) {
            const sessionGroup = document.getElementById('session_group');
            if (role === 'coach') {
                sessionGroup.style.display = 'none';
            } else {
                sessionGroup.style.display = 'block';
            }
        }
    </script>
</body>
</html>
